version: 2

# Workflow actions are pinned by commit SHA; Dependabot moves the SHA and its
# version comment. Three days of cooldown: a version out for three days has had
# three days for someone else to find a yanked release. Security updates are
# not delayed by it.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
